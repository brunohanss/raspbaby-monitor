[workspace]
resolver = "2"
members = ["crates/*", "apps/monitor/src-tauri"]
default-members = [
  "crates/raspbaby-protocol",
  "crates/raspbaby-media",
  "crates/raspbaby-daemon",
  "crates/raspbaby-detection",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/brunohanss/raspbaby-monitor"
