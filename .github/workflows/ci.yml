name: Quality

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - run: cargo fmt --all -- --check
      - run: cargo test --locked
      - run: cargo clippy --locked --all-targets -- -D warnings
      - run: python3 -m unittest discover -s tests -v
      - run: python3 -m unittest discover -s tools/pi3-dwc2-pio -p test_tools.py -v
      - run: python3 -m unittest discover -s tools/pi3-dwc2-pio/persistent -p test_persistent.py -v

  media-native:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - name: Install native media dependencies
        run: >-
          sudo apt-get update && sudo apt-get install -y
          libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev
          libgstreamer-plugins-bad1.0-dev gstreamer1.0-plugins-base
          gstreamer1.0-plugins-good gstreamer1.0-plugins-bad
          gstreamer1.0-plugins-ugly gstreamer1.0-nice gstreamer1.0-alsa
      - run: cargo test --locked -p raspbaby-daemon -p raspbaby-media --features gstreamer-runtime
      - run: cargo clippy --locked -p raspbaby-daemon -p raspbaby-media --features gstreamer-runtime --all-targets -- -D warnings
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @raspbaby/monitor exec playwright install --with-deps chromium
      - run: pnpm build
      - run: cargo build --locked -p raspbaby-daemon --features gstreamer-runtime
      - name: Check synthetic media in Chromium
        env:
          RASPBABY_SPIKE_BIN: ${{ github.workspace }}/target/debug/raspbaby-daemon
          RASPBABY_TEST_URL: http://127.0.0.1:1421
        run: |
          pnpm --filter @raspbaby/monitor exec vite preview --host 127.0.0.1 --port 1421 &
          preview_pid=$!
          trap 'kill "$preview_pid"' EXIT
          for attempt in $(seq 1 30); do
            if curl --silent --fail http://127.0.0.1:1421/ > /dev/null; then break; fi
            sleep 1
          done
          pnpm --filter @raspbaby/monitor test:media

  frontend:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - run: pnpm --filter @raspbaby/monitor format:check
      - run: pnpm test
      - run: pnpm --filter @raspbaby/monitor exec node scripts/media-integration.mjs --self-test
      - run: pnpm build

  windows-shell:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: cargo check --locked -p raspbaby-monitor-app
      - run: cargo test --locked -p raspbaby-monitor-app

  dependencies:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: pnpm install --frozen-lockfile
      - run: pnpm audit --audit-level high
      - run: cargo install cargo-audit --locked
      - run: cargo audit
